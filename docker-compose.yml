# File: docker-compose.yml
# Description: Docker Compose configuration for local development environment
# Dependencies: Postgres, Seq, Identity Server
# Created: 2026-03-01

services:
  postgres:
    image: postgres:15-alpine
    container_name: music_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: musicidentity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # seq:
  #   image: datalust/seq:latest
  #   container_name: music_seq
  #   environment:
  #     ACCEPT_EULA: Y
  #   ports:
  #     - "5341:80"
  #     - "5342:5341"
  #   restart: unless-stopped

  adminer:
    image: adminer:latest
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Use the database service name (db) as the server name for Adminer to connect
      ADMINER_DEFAULT_SERVER: db
    # Depends on the db service to ensure it starts after the database is available
    depends_on:
      - postgres

  innowise.musicidentityserver:
    build:
      context: .
      dockerfile: Innowise.MusicIdentityServer/Dockerfile
    container_name: music_identity_server
    depends_on:
      - postgres
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__PostgresAppDbConnection=Server=postgres;Port=5432;Database=musicidentity;User Id=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "5236:8080" # Mapping to launchSettings.json port
      - "7008:8081" # HTTPS mapping for MAUI app
    restart: unless-stopped

  innowise.music.admin:
    build:
      context: .
      dockerfile: Innowise.Music.Admin/Dockerfile
    container_name: music_admin_dashboard
    depends_on:
      - innowise.musicidentityserver
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ApiSettings__BaseUrl=http://music_identity_server:8080/api
    ports:
      - "5237:8080" # Admin dashboard port
    restart: unless-stopped

volumes:
  postgres_data:
